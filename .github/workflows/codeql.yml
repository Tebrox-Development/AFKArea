name: CodeQL

on:
  pull_request:
    branches: [development, main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [development, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  classify:
    name: Classify change
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Detect documentation-only change
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docs_only=false

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "docs_only=${docs_only}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base="${PR_BASE_SHA}"
            head="${PR_HEAD_SHA}"
          else
            base="${BEFORE_SHA}"
            head="${GITHUB_SHA}"
          fi

          if [[ -z "${base}" || -z "${head}" || "${base}" =~ ^0+$ ]]; then
            echo "Unable to determine a reliable diff; running the full check."
            echo "docs_only=${docs_only}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if ! git diff --name-only "${base}" "${head}" > changed-files.txt; then
            echo "Unable to inspect changed files; running the full check."
            echo "docs_only=${docs_only}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ ! -s changed-files.txt ]]; then
            echo "No changed files detected; running the full check."
            echo "docs_only=${docs_only}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          docs_only=true
          while IFS= read -r file; do
            case "${file}" in
              docs/*|*.md) ;;
              *) docs_only=false; break ;;
            esac
          done < changed-files.txt

          echo "Changed files:"
          sed 's/^/ - /' changed-files.txt
          echo "Documentation-only: ${docs_only}"
          echo "docs_only=${docs_only}" >> "${GITHUB_OUTPUT}"

  analyze:
    name: Java CodeQL
    needs: classify
    if: ${{ always() && (needs.classify.result != 'success' || needs.classify.outputs.docs_only != 'true') }}
    runs-on: [self-hosted, X64, resource-heavy]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Bootstrap pending
        if: ${{ hashFiles('pom.xml') == '' }}
        run: echo "pom.xml is not present yet; CodeQL analysis will activate after project bootstrap."

      - name: Set up Java 25
        if: ${{ hashFiles('pom.xml') != '' }}
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Initialize CodeQL
        if: ${{ hashFiles('pom.xml') != '' }}
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: java-kotlin

      - name: Build
        if: ${{ hashFiles('pom.xml') != '' }}
        run: mvn -B -ntp -DskipTests package

      - name: Analyze
        if: ${{ hashFiles('pom.xml') != '' }}
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          upload: never
