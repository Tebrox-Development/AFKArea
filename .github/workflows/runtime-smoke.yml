name: Runtime Smoke

on:
  pull_request:
    branches: [development, main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [development, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    name: Classify runtime change
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Detect documentation-only change
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          docs_only=false

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "docs_only=${docs_only}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base="${PR_BASE_SHA}"
            head="${PR_HEAD_SHA}"
          else
            base="${BEFORE_SHA}"
            head="${GITHUB_SHA}"
          fi

          if [[ -z "${base}" || -z "${head}" || "${base}" =~ ^0+$ ]]; then
            echo "docs_only=${docs_only}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git diff --name-only "${base}" "${head}" > changed-files.txt

          if [[ ! -s changed-files.txt ]]; then
            echo "docs_only=${docs_only}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          docs_only=true

          while IFS= read -r file; do
            case "${file}" in
              docs/*|*.md) ;;
              *) docs_only=false; break ;;
            esac
          done < changed-files.txt

          echo "Changed files:"
          sed 's/^/ - /' changed-files.txt

          echo "Documentation-only: ${docs_only}"
          echo "docs_only=${docs_only}" >> "${GITHUB_OUTPUT}"

  runtime-smoke:
    name: Paper ${{ matrix.paper_version }} / ${{ matrix.stack }} / Java ${{ matrix.runtime_java }}
    needs: classify
    if: ${{ always() && (needs.classify.result != 'success' || needs.classify.outputs.docs_only != 'true') }}
    runs-on: [self-hosted, X64, resource-heavy]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack: VertexCore
            paper_version: '1.21.4'
            paper_build: '232'
            runtime_java: '21'
            enable_worldguard: 'false'
          - stack: VertexCore
            paper_version: '26.2'
            paper_build: '121'
            runtime_java: '25'
            enable_worldguard: 'false'
          - stack: VertexCore + WorldGuard
            paper_version: '26.2'
            paper_build: '121'
            runtime_java: '25'
            enable_worldguard: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Java 21 runtime
        if: ${{ matrix.runtime_java == '21' }}
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Java 25 build toolchain
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify
        run: mvn -B -ntp verify

      - name: Runtime smoke
        env:
          PAPER_VERSION: ${{ matrix.paper_version }}
          PAPER_BUILD: ${{ matrix.paper_build }}
          RUNTIME_JAVA_VERSION: ${{ matrix.runtime_java }}
          VERTEXCORE_VERSION: 'v1.1.0'
          ENABLE_WORLDGUARD: ${{ matrix.enable_worldguard }}
          WORLDGUARD_VERSION: '7.0.18'
          WORLDEDIT_VERSION: '7.4.4'
        run: bash scripts/runtime-smoke.sh
